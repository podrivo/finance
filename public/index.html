<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
  <script>
    try {
      const theme = localStorage.getItem('ipca:theme');
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/chart.css">
  <link rel="stylesheet" href="/css/controls.css">
  <link rel="stylesheet" href="/css/tooltip.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="tooltip"></div>
  <div id="controls">
    <nav id="ranges">
      <button data-range="all">All</button>
      <button data-range="real">Since 1995</button>
      <button data-range="10y">10Y</button>
      <button data-range="5y">5Y</button>
    </nav>
    <button id="theme" aria-keyshortcuts="M">
      <svg data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
    </button>
  </div>
  <div id="chart">
    <div id="selection"></div>
    <canvas></canvas>
    <div id="crosshair"><div id="vline"></div><div id="hline"></div><div id="dot"></div></div>
    <div id="labels"></div>
  </div>
</body>
</html>
