name: Update index data

on:
  schedule:
    # 13:00 UTC is 10:00 in Brasília, an hour after IBGE's usual 9:00 release.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Commit whatever succeeded even if one index failed; the job still fails afterwards.
      - id: update
        run: node update.js
        continue-on-error: true
      - name: Commit and push if changed
        run: |
          changed=$(git status --porcelain --untracked-files=all data/ | awk '{print $2}')
          [ -z "$changed" ] && exit 0
          summary=$(for f in $changed; do echo "$(basename "$f" .json | tr a-z A-Z) through $(jq -r '.series[-1].date' "$f")"; done | paste -sd ',' - | sed 's/,/, /g')
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Update $summary"
          git pull --rebase origin HEAD
          git push
      - if: steps.update.outcome == 'failure'
        run: exit 1
