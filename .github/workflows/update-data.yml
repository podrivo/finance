name: Update IPCA data

on:
  schedule:
    # 13:00 UTC is 10:00 in Brasília, an hour after IBGE's usual 9:00 release.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node update.js
      - name: Commit and push if changed
        run: |
          git diff --quiet data/ipca.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/ipca.json
          git commit -m "Update IPCA data through $(jq -r '.series[-1].date' data/ipca.json)"
          git push
