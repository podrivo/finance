<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
  <style>
    html, body { overscroll-behavior: none; }
    body {
      margin: 0;
      font: 14px/1.4 'Geist', system-ui, sans-serif;
      color: #000;
      background: #fff;
      user-select: none;
    }
    #chart { position: fixed; inset: 0; contain: strict; color: #888; font-size: 12px; cursor: crosshair; }
    #chart > * { position: absolute; pointer-events: none; }
    canvas { inset: 0; width: 100%; height: 100%; pointer-events: auto !important; touch-action: none; }
    #labels { inset: 0; contain: strict; }
    .label { position: absolute; top: 0; left: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #crosshair { inset: 0; visibility: hidden; }
    #vline, #hline { position: absolute; top: 0; left: 0; }
    #vline { width: 1px; height: 100%; background: repeating-linear-gradient(to bottom, #ccc 0 4px, transparent 4px 8px); }
    #hline { width: 100%; height: 1px; background: repeating-linear-gradient(to right, #ccc 0 4px, transparent 4px 8px); }
    #dot { position: absolute; top: -4px; left: -4px; width: 8px; height: 8px; border-radius: 50%; background: #000; box-shadow: 0 0 0 2px #fff; }
    #selection { top: 0; left: 0; width: 1px; height: 100%; transform-origin: left; background: rgb(0 0 0 / 0.06); visibility: hidden; }
    #controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1;
      font-size: 12px;
    }
    #ranges { display: flex; gap: 4px; }
    #ranges button {
      font: inherit;
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      color: #888;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease;
    }
    #ranges button.active { border-color: #000; color: #000; }
    @media (hover: hover) and (pointer: fine) {
      #ranges button:hover { color: #000; }
    }
    #tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: #000;
      color: #fff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 125ms ease;
    }
    #tooltip.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <div id="controls">
    <nav id="ranges">
      <button data-range="all">All</button>
      <button data-range="real">Since 1995</button>
      <button data-range="10y">10Y</button>
      <button data-range="5y">5Y</button>
    </nav>
  </div>
  <div id="chart">
    <div id="selection"></div>
    <canvas></canvas>
    <div id="crosshair"><div id="vline"></div><div id="hline"></div><div id="dot"></div></div>
    <div id="labels"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const ELECTIONS = ['1989-11', '1994-10', '1998-10', '2002-10', '2006-10', '2010-10', '2014-10', '2018-10', '2022-10', '2026-10'];
    const STEPS = [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100];
    const MONTH_STEPS = [1, 3, 6, 12];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const percent = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const MIN_GAP = 56; // px between time labels
    const DURATION = 280;
    const FADE = 200;
    const Y_EASE = 70; // ms time constant for the vertical range to follow gestures
    const MIN_SPAN = 6; // months
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function cubicBezier(x1, y1, x2, y2) {
      const at = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
      return (x) => {
        let lo = 0;
        let hi = 1;
        let t = x;
        for (let k = 0; k < 30 && Math.abs(at(t, x1, x2) - x) > 1e-5; k++) {
          at(t, x1, x2) < x ? (lo = t) : (hi = t);
          t = (lo + hi) / 2;
        }
        return at(t, y1, y2);
      };
    }
    const easeInOut = cubicBezier(0.77, 0, 0.175, 1);

    const chart = $('chart');
    const canvas = chart.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const labels = $('labels');
    const tooltip = $('tooltip');
    let series, values, n;
    let view;      // the currently displayed window, possibly mid-animation
    let anim = null;
    let yGoal = null; // vertical range that gestures ease toward
    let frame = 0;
    let lastDraw = 0;
    let lastFrame = 0;
    let box;
    let pointerX = null;
    let pointerY = 0;
    let hoverQueued = false;
    let shown = { i: -1, view: null };
    let dragStart = null;
    const fades = new Map(); // tick key -> { tick, o, el }
    let elections = [];

    function valueTicks() {
      const { yMin: lo, yMax: hi } = view;
      const step = STEPS.find((s) => (hi - lo) / s <= 8);
      const out = [];
      for (let k = Math.ceil(lo / step); k * step <= hi; k++) {
        const v = +(k * step).toFixed(2);
        out.push({ key: `y${v}`, axis: 'y', v, text: `${v}%` });
      }
      return out;
    }

    // Election years when zoomed out; every year, then quarters, then months as there's room.
    function timeTicks() {
      const perMonth = box.width / (view.x1 - view.x0);
      const step = MONTH_STEPS.find((s) => s * perMonth >= MIN_GAP);
      if (!step) return elections.map((i) => ({ key: `e${i}`, axis: 'x', i, text: series[i].date.slice(0, 4) }));
      const out = [];
      for (let i = Math.max(0, Math.floor(view.x0)); i <= Math.min(n - 1, Math.ceil(view.x1)); i++) {
        const [year, month] = series[i].date.split('-').map(Number);
        if ((month - 1) % step) continue;
        out.push({ key: `m${i}`, axis: 'x', i, line: month === 1 ? '#e4e4e4' : '#f4f4f4', text: month === 1 ? `${year}` : MONTHS[month - 1] });
      }
      return out;
    }

    // Visible window over months a..b, with the vertical range fitted to that slice.
    function windowFor(a, b) {
      const slice = values.slice(Math.floor(a), Math.ceil(b) + 1);
      const lo = Math.min(0, ...slice);
      const hi = Math.max(...slice);
      const range = hi - lo;
      return { x0: a, x1: b, yMin: lo - range * 0.06, yMax: hi + range * 0.04 };
    }

    // Monotone cubic tangent (as in d3's curveMonotoneX): the curve passes through every
    // month without overshooting, so smoothing never invents peaks or dips.
    function slopeAt(i) {
      if (i === 0) return values[1] - values[0];
      if (i === n - 1) return values[i] - values[i - 1];
      const s0 = values[i] - values[i - 1];
      const s1 = values[i + 1] - values[i];
      return (Math.sign(s0) + Math.sign(s1)) * Math.min(Math.abs(s0), Math.abs(s1), Math.abs(s0 + s1) / 4);
    }

    const toX = (i) => ((i - view.x0) / (view.x1 - view.x0)) * box.width;
    const toY = (v) => ((view.yMax - v) / (view.yMax - view.yMin)) * box.height;

    function resize() {
      box = chart.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      canvas.width = Math.round(box.width * dpr);
      canvas.height = Math.round(box.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      shown.view = null;
      if (draw(performance.now())) invalidate();
    }

    function invalidate() {
      if (!frame) frame = requestAnimationFrame(render);
    }

    function render(now) {
      frame = 0;
      if (anim) {
        const p = Math.min(1, (now - anim.start) / DURATION);
        const e = easeInOut(p);
        const lerp = (key) => anim.from[key] + (anim.to[key] - anim.from[key]) * e;
        view = { x0: lerp('x0'), x1: lerp('x1'), yMin: lerp('yMin'), yMax: lerp('yMax') };
        if (p === 1) anim = null;
      } else if (yGoal) {
        const k = reduceMotion.matches ? 1 : 1 - Math.exp(-Math.min(now - lastFrame, 34) / Y_EASE);
        const yMin = view.yMin + (yGoal.yMin - view.yMin) * k;
        const yMax = view.yMax + (yGoal.yMax - view.yMax) * k;
        const settled = Math.abs(yGoal.yMin - yMin) + Math.abs(yGoal.yMax - yMax) < (yGoal.yMax - yGoal.yMin) * 1e-3;
        view = { ...view, ...(settled ? yGoal : { yMin, yMax }) };
        if (settled) yGoal = null;
      }
      lastFrame = now;
      if (draw(now) || anim || yGoal) invalidate();
    }

    // Ticks fade in and out on their own clock as the view crosses scale thresholds.
    // Returns true while any fade is still running.
    function draw(now) {
      const dt = reduceMotion.matches ? 1 : Math.min(now - lastDraw, 34) / FADE;
      lastDraw = now;
      const wanted = new Map([...valueTicks(), ...timeTicks()].map((t) => [t.key, t]));
      for (const [key, tick] of wanted) {
        if (fades.has(key)) continue;
        const el = document.createElement('span');
        el.className = 'label';
        el.textContent = tick.text;
        labels.append(el);
        fades.set(key, { tick, o: 0, el });
      }
      let fading = false;
      for (const [key, f] of fades) {
        const on = wanted.has(key);
        f.o = on ? Math.min(1, f.o + dt) : Math.max(0, f.o - dt);
        if (f.o !== +on) fading = true;
        if (!on && f.o === 0) {
          f.el.remove();
          fades.delete(key);
        }
      }

      ctx.clearRect(0, 0, box.width, box.height);
      ctx.lineWidth = 1;
      for (const { tick, o } of fades.values()) {
        if (tick.axis === 'x' ? !tick.line : tick.v !== 0) continue;
        ctx.globalAlpha = o;
        ctx.strokeStyle = tick.axis === 'x' ? tick.line : '#ccc';
        ctx.beginPath();
        if (tick.axis === 'y') {
          const y = Math.round(toY(tick.v)) + 0.5;
          ctx.moveTo(0, y);
          ctx.lineTo(box.width, y);
        } else {
          const x = Math.round(toX(tick.i)) + 0.5;
          ctx.moveTo(x, 0);
          ctx.lineTo(x, box.height);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#eee';
      ctx.beginPath();
      for (const i of elections) {
        const x = Math.round(toX(i)) + 0.5;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, box.height);
      }
      ctx.stroke();

      const a = Math.max(0, Math.floor(view.x0) - 1);
      const b = Math.min(n - 1, Math.ceil(view.x1) + 1);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(toX(a), toY(values[a]));
      for (let i = a; i < b; i++) {
        const [m0, m1] = [slopeAt(i), slopeAt(i + 1)];
        ctx.bezierCurveTo(
          toX(i + 1 / 3), toY(values[i] + m0 / 3),
          toX(i + 2 / 3), toY(values[i + 1] - m1 / 3),
          toX(i + 1), toY(values[i + 1])
        );
      }
      ctx.stroke();

      for (const { tick, o, el } of fades.values()) {
        if (tick.axis === 'y') {
          const y = toY(tick.v);
          el.style.opacity = y < 0 || y > box.height ? 0 : o;
          el.style.transform = `translate(8px, calc(${y}px - 100% - 2px))`;
        } else {
          const x = toX(tick.i);
          el.style.opacity = x < 0 || x > box.width ? 0 : o;
          el.style.transform = `translate(${x + 4}px, calc(${box.height - 8}px - 100%))`;
        }
      }

      if (pointerX !== null) hover();
      return fading;
    }

    function animateTo(next) {
      save(next.x0, next.x1);
      yGoal = null;
      if (reduceMotion.matches) {
        anim = null;
        view = next;
        chart.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 150, easing: 'ease' });
      } else {
        anim = { from: view, to: next, start: performance.now() };
      }
      invalidate();
    }

    function indexAt(clientX) {
      const i = Math.round(view.x0 + ((clientX - box.left) / box.width) * (view.x1 - view.x0));
      return Math.max(Math.ceil(view.x0), Math.min(Math.floor(view.x1), i));
    }

    // Scales the window by `factor` (1 to just pan), keeping the month under `fromX` pinned beneath `toX`.
    function zoom(fromX, toX, factor) {
      const span = view.x1 - view.x0;
      const next = Math.max(MIN_SPAN, Math.min(n - 1, span * factor));
      const anchor = view.x0 + ((fromX - box.left) / box.width) * span;
      const x0 = Math.max(0, Math.min(n - 1 - next, anchor - ((toX - box.left) / box.width) * next));
      if (x0 === view.x0 && next === span) return;
      anim = null;
      const { yMin, yMax } = windowFor(x0, x0 + next);
      if (!yGoal) lastFrame = performance.now();
      view = { ...view, x0, x1: x0 + next };
      yGoal = { yMin, yMax };
      setActive(null);
      save(x0, x0 + next);
      invalidate();
    }

    // Mouse events can outpace the display; handle at most one per frame.
    function queueHover() {
      if (hoverQueued) return;
      hoverQueued = true;
      requestAnimationFrame(() => {
        hoverQueued = false;
        if (pointerX !== null) hover();
      });
    }

    // The crosshair, selection and tooltip are plain elements moved with transforms,
    // so hovering never repaints the canvas.
    // The tooltip sits beside the mouse; the crosshair and dot snap to the nearest month.
    function hover() {
      const flip = pointerX > innerWidth - 180;
      const below = pointerY < 48;
      tooltip.style.transform =
        `translate(${pointerX + (flip ? -12 : 12)}px, ${pointerY + (below ? 16 : -36)}px)` + (flip ? ' translateX(-100%)' : '');
      tooltip.classList.add('visible');

      const i = indexAt(pointerX);
      if (i === shown.i && view === shown.view) return;
      if (i !== shown.i) {
        const [year, month] = series[i].date.split('-').map(Number);
        tooltip.textContent = `${MESES[month - 1]}, ${year} · ${percent.format(values[i])}%`;
      }
      shown = { i, view };

      const x = toX(i);
      const y = toY(values[i]);
      $('vline').style.transform = `translateX(${Math.round(x)}px)`;
      $('hline').style.transform = `translateY(${Math.round(y)}px)`;
      $('dot').style.transform = `translate(${x}px, ${y}px)`;
      $('crosshair').style.visibility = 'visible';

      if (dragStart !== null) {
        const left = toX(Math.min(dragStart, i));
        const sel = $('selection');
        sel.style.transform = `translateX(${left}px) scaleX(${toX(Math.max(dragStart, i)) - left})`;
        sel.style.visibility = 'visible';
      }
    }

    const buttons = document.querySelectorAll('#ranges button');
    let activeRange = null;
    const setActive = (range) => {
      activeRange = range;
      buttons.forEach((b) => b.classList.toggle('active', b.dataset.range === range));
    };
    const RANGES = {
      all: () => [0, n - 1],
      real: () => [series.findIndex((p) => p.date >= '1995-01'), n - 1],
      '10y': () => [n - 120, n - 1],
      '5y': () => [n - 60, n - 1],
    };

    // A preset range is saved by name so it keeps tracking the latest months; a custom
    // zoom is saved as month indices, which stay stable because the series starts in 1980-01.
    const STORAGE_KEY = 'ipca:view';
    let saveTimer = 0;
    function save(x0, x1) {
      clearTimeout(saveTimer);
      const state = activeRange ? { range: activeRange } : { x0, x1 };
      saveTimer = setTimeout(() => localStorage.setItem(STORAGE_KEY, JSON.stringify(state)), 200);
    }
    function restore() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (RANGES[s.range]) return [s.range, RANGES[s.range]()];
        if (s.x0 >= 0 && s.x1 <= n - 1 && s.x1 - s.x0 >= MIN_SPAN) return [null, [s.x0, s.x1]];
      } catch {}
      return ['real', RANGES.real()];
    }

    function init(data) {
      series = data.series.filter((p) => p.monthly !== null);
      values = series.map((p) => p.monthly);
      n = series.length;

      elections = series.flatMap((p, i) => (ELECTIONS.includes(p.date) ? [i] : []));

      const [range, win] = restore();
      setActive(range);
      view = windowFor(...win);
      new ResizeObserver(resize).observe(chart);

      buttons.forEach((b) =>
        b.addEventListener('click', () => {
          setActive(b.dataset.range);
          animateTo(windowFor(...RANGES[b.dataset.range]()));
        })
      );

      canvas.addEventListener('mousedown', (e) => (dragStart = indexAt(e.clientX)));
      canvas.addEventListener('mousemove', (e) => {
        pointerX = e.clientX;
        pointerY = e.clientY;
        queueHover();
      });
      addEventListener('mouseup', (e) => {
        if (dragStart === null) return;
        const [a, b] = [dragStart, indexAt(e.clientX)].sort((x, y) => x - y);
        dragStart = null;
        $('selection').style.visibility = 'hidden';
        if (b - a < 2) return;
        setActive(null);
        animateTo(windowFor(a, b));
      });
      canvas.addEventListener('dblclick', () => {
        setActive('all');
        animateTo(windowFor(...RANGES.all()));
      });
      // Trackpad pinch arrives as ctrl+wheel in Chrome and Firefox, and as gesture events in Safari.
      // Plain scrolling zooms (vertical) or pans (horizontal), whichever direction dominates.
      // Listens on the whole window and claims every scroll, so browsers never treat a
      // sideways swipe as back/forward.
      addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const scale = e.deltaMode === 1 ? 16 : 1;
          const [dx, dy] = [e.deltaX * scale, e.deltaY * scale];
          if (e.ctrlKey) zoom(e.clientX, e.clientX, Math.exp(dy * 0.01));
          else if (Math.abs(dx) > Math.abs(dy)) zoom(e.clientX, e.clientX - dx, 1);
          else zoom(e.clientX, e.clientX, Math.exp(dy * 0.002));
        },
        { passive: false }
      );
      let gestureScale = 1;
      canvas.addEventListener('gesturestart', (e) => {
        e.preventDefault();
        gestureScale = 1;
      });
      canvas.addEventListener('gesturechange', (e) => {
        e.preventDefault();
        zoom(e.clientX, e.clientX, gestureScale / e.scale);
        gestureScale = e.scale;
      });

      // One finger pans, two fingers pinch (and pan by their midpoint).
      let pinch = null;
      const pinchOf = (touches) => {
        if (touches.length === 1) return { x: touches[0].clientX, d: 1 };
        const [p, q] = touches;
        return { x: (p.clientX + q.clientX) / 2, d: Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY) };
      };
      const startTouch = (e) => {
        pinch = e.touches.length ? pinchOf(e.touches) : null;
        dragStart = null;
        $('selection').style.visibility = 'hidden';
      };
      canvas.addEventListener('touchstart', startTouch);
      canvas.addEventListener('touchend', startTouch);
      canvas.addEventListener('touchcancel', startTouch);
      canvas.addEventListener('touchmove', (e) => {
        if (!pinch) return;
        const next = pinchOf(e.touches);
        zoom(pinch.x, next.x, pinch.d / Math.max(1, next.d));
        pinch = next;
      });
      canvas.addEventListener('mouseleave', () => {
        pointerX = null;
        shown = { i: -1, view: null };
        $('crosshair').style.visibility = 'hidden';
        tooltip.classList.remove('visible');
      });
    }

    fetch('/api/ipca')
      .then((r) => (r.ok ? r.json() : r.text().then((t) => Promise.reject(new Error(t)))))
      .then(init)
      .catch((err) => (chart.textContent = `Error: ${err.message}`));
  </script>
</body>
</html>
