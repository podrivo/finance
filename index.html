<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
  <style>
    body {
      margin: 0;
      font: 14px/1.4 'Geist', system-ui, sans-serif;
      color: #000;
      background: #fff;
    }
    #chart { position: fixed; inset: 0; color: #888; font-size: 12px; }
    svg { display: block; width: 100%; height: 100%; }
    .label { position: absolute; white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
    .label.y { left: 8px; transform: translateY(calc(-100% - 2px)); }
    .label.x { bottom: 8px; transform: translateX(4px); }
    #tooltip {
      position: fixed;
      pointer-events: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: #000;
      color: #fff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      display: none;
    }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <div id="chart"><svg preserveAspectRatio="none"></svg></div>

  <script>
    const $ = (id) => document.getElementById(id);

    fetch('/api/ipca')
      .then((r) => (r.ok ? r.json() : r.text().then((t) => Promise.reject(new Error(t)))))
      .then((data) => {
        const series = data.series.filter((p) => p.monthly !== null);
        const values = series.map((p) => p.monthly);
        const min = Math.min(0, ...values);
        const max = Math.max(...values);
        const range = max - min;
        const yMax = max + range * 0.04;
        const yMin = min - range * 0.06;
        const w = series.length - 1;
        const h = yMax - yMin;
        const y = (v) => yMax - v;

        const step = [1, 2, 5, 10, 20, 50, 100].find((s) => range / s <= 8);
        const yTicks = [];
        for (let v = Math.ceil(min / step) * step; v <= max; v += step) yTicks.push(v);
        const ELECTIONS = ['1989-11', '1994-10', '1998-10', '2002-10', '2006-10', '2010-10', '2014-10', '2018-10', '2022-10', '2026-10'];
        const xTicks = series.map((p, i) => [p.date, i]).filter(([date]) => ELECTIONS.includes(date));

        const chart = $('chart');
        const svg = chart.querySelector('svg');
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        const points = values.map((v, i) => `${i},${y(v)}`).join(' ');
        const gridLine = (x1, y1, x2, y2, color) =>
          `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" vector-effect="non-scaling-stroke" />`;
        svg.innerHTML = `
          ${yTicks.map((v) => gridLine(0, y(v), w, y(v), v === 0 ? '#ccc' : '#eee')).join('')}
          ${xTicks.map(([, i]) => gridLine(i, 0, i, h, '#eee')).join('')}
          <polyline points="${points}" fill="none" stroke="#000" stroke-width="1.5" vector-effect="non-scaling-stroke" />
          <g id="crosshair" stroke="#ccc" vector-effect="non-scaling-stroke" visibility="hidden">
            <line id="vline" y1="0" y2="${h}" vector-effect="non-scaling-stroke" />
            <line id="hline" x1="0" x2="${w}" vector-effect="non-scaling-stroke" />
          </g>`;

        const tooltip = $('tooltip');
        svg.addEventListener('mousemove', (e) => {
          const { left, top, width, height } = svg.getBoundingClientRect();
          const i = Math.max(0, Math.min(w, Math.round(((e.clientX - left) / width) * w)));
          const py = y(values[i]);

          $('vline').setAttribute('x1', i);
          $('vline').setAttribute('x2', i);
          $('hline').setAttribute('y1', py);
          $('hline').setAttribute('y2', py);
          $('crosshair').setAttribute('visibility', 'visible');

          const sx = left + (i / w) * width;
          const sy = top + (py / h) * height;
          tooltip.textContent = `${series[i].date}: ${values[i].toFixed(2)}%`;
          tooltip.style.display = 'block';
          tooltip.style.top = `${sy - 32}px`;
          tooltip.style.left = sx > innerWidth - 160 ? `${sx - tooltip.offsetWidth - 10}px` : `${sx + 10}px`;
        });
        svg.addEventListener('mouseleave', () => {
          $('crosshair').setAttribute('visibility', 'hidden');
          tooltip.style.display = 'none';
        });

        chart.insertAdjacentHTML(
          'beforeend',
          yTicks.map((v) => `<span class="label y" style="top:${(y(v) / h) * 100}%">${v}%</span>`).join('') +
            xTicks.map(([date, i]) => `<span class="label x" style="left:${(i / w) * 100}%">${date.slice(0, 4)}</span>`).join('')
        );
      })
      .catch((err) => ($('chart').textContent = `Error: ${err.message}`));
  </script>
</body>
</html>
